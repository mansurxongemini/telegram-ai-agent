<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17212b" />
    <title>Telegram AI Userbot Workspace</title>
    <link rel="stylesheet" href="./css/telegram.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%232ea6ff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E%E2%9C%88%3C/text%3E%3C/svg%3E"
    />

    <!--
      Telegram connectivity now runs through a local Node.js bridge
      (server/server.js) that hosts gramjs. The browser talks to it over a
      WebSocket, so there is NO gramjs / Buffer / crypto polyfill in the
      browser at all. Start the bridge with:  cd server && npm install && npm start
      then open http://localhost:8123
    -->
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack"></div>

    <script type="module" src="./js/app.js"></script>
    <script>
      // The Service Worker caused stale cached code to keep loading during
      // development (old in-browser gramjs instead of the Node bridge). We now
      // run everything through the Node bridge, so the SW is unnecessary.
      // Actively UNREGISTER any previously installed worker and purge its
      // caches so the latest code always loads.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
      }
    </script>
  </body>
</html>
