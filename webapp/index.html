<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17212b" />
    <title>Telegram AI Userbot Workspace</title>
    <link rel="stylesheet" href="./css/telegram.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%232ea6ff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E%E2%9C%88%3C/text%3E%3C/svg%3E"
    />

    <!--
      gramjs is loaded from esm.sh as a single bundle, but with Node's "crypto"
      kept EXTERNAL. esm.sh's default node polyfill (unenv) does NOT implement
      crypto.createHash, which gramjs needs for MTProto auth — that caused
      "[unenv] crypto.createHash is not implemented yet!".

      By marking crypto external we resolve it ourselves (via the import map
      below) to crypto-browserify, a full browser implementation of Node's
      crypto (createHash / createHmac / randomBytes / AES). Buffer is also
      provided as a global by the polyfill module in <body>.
    -->
    <script type="importmap">
      {
        "imports": {
          "telegram": "https://esm.sh/telegram@2.26.22?bundle&external=crypto,buffer",
          "crypto": "https://esm.sh/crypto-browserify@3.12.1",
          "buffer": "https://esm.sh/buffer@6.0.3"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack"></div>

    <!--
      gramjs internally uses Node.js Buffer / process / global. Browsers lack
      them, which causes "Buffer is not defined" when signing in.

      ES module scripts execute in DOCUMENT ORDER and each waits for its
      imports, so this polyfill module is guaranteed to finish (and set the
      globals) BEFORE app.js — and therefore before the gramjs bundle is
      evaluated.
    -->
    <script type="module">
      import { Buffer } from "buffer";
      globalThis.Buffer = Buffer;
      globalThis.global = globalThis;
      if (!globalThis.process)
        globalThis.process = { env: {}, version: "v18.0.0", browser: true, nextTick: (fn, ...a) => setTimeout(() => fn(...a), 0) };
    </script>

    <script type="module" src="./js/app.js"></script>
    <script>
      // Register the service worker for background notifications / polling (#13).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .catch((err) => console.warn("SW registration failed", err));
        });
      }
    </script>
  </body>
</html>
